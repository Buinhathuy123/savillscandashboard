<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Savills Scans Dashboard</title>


<style>

/* ============================================================
   GLOBAL
   ============================================================ */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f4f5f7;

  color: #222;

}


/* ============================================================
   LOGIN
   ============================================================ */

#loginPage {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.login-card {

  width: 100%;

  max-width: 420px;

  background: white;

  padding: 40px;

  border-radius: 18px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.10);

}


.login-logo {

  text-align: center;

  margin-bottom: 25px;

}


.login-logo h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 700;

}


.login-logo p {

  margin:
    8px
    0
    0;

  color: #777;

}


.form-group {

  margin-bottom: 18px;

}


.form-group label {

  display: block;

  margin-bottom: 7px;

  font-size: 14px;

  font-weight: bold;

}


.form-group input {

  width: 100%;

  padding: 13px 14px;

  border:
    1px solid
    #d1d5db;

  border-radius: 9px;

  font-size: 15px;

  outline: none;

}


.form-group input:focus {

  border-color: #555;

}


.password-wrapper {

  position: relative;

}


.password-wrapper input {

  padding-right: 75px;

}


.toggle-password {

  position: absolute;

  right: 10px;

  top: 50%;

  transform:
    translateY(-50%);

  border: none;

  background: transparent;

  cursor: pointer;

  color: #555;

  font-size: 13px;

}


.login-button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 9px;

  background: #FFD700;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.login-button:hover {

  background: #f2cc00;

}


.login-button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


.login-status {

  min-height: 22px;

  margin-top: 15px;

  text-align: center;

  font-size: 14px;

}


.login-error {

  color: #dc2626;

}


/* ============================================================
   DASHBOARD
   ============================================================ */

#dashboardPage {

  display: none;

  min-height: 100vh;

}


/* ============================================================
   HEADER
   ============================================================ */

.header {

  background: white;

  border-bottom:
    1px solid
    #e5e7eb;

  padding:
    18px
    30px;

  display: flex;

  justify-content: space-between;

  align-items: center;

}


.header-left h1 {

  margin: 0;

  font-size: 24px;

}


.header-left p {

  margin:
    5px
    0
    0;

  color: #777;

  font-size: 13px;

}


.header-right {

  display: flex;

  align-items: center;

  gap: 15px;

}


.last-updated {

  color: #777;

  font-size: 12px;

}


.logout-button {

  border: none;

  background: #eee;

  padding:
    9px
    14px;

  border-radius: 8px;

  cursor: pointer;

}


.logout-button:hover {

  background: #ddd;

}


/* ============================================================
   MAIN
   ============================================================ */

.main {

  max-width: 1400px;

  margin: auto;

  padding: 30px;

}


/* ============================================================
   STATISTICS
   ============================================================ */

.stats {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap: 20px;

  margin-bottom: 25px;

}


.stat-card {

  background: white;

  padding: 22px;

  border-radius: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.05);

}


.stat-title {

  color: #777;

  font-size: 14px;

  margin-bottom: 10px;

}


.stat-value {

  font-size: 30px;

  font-weight: bold;

}


/* ============================================================
   TOOLBAR
   ============================================================ */

.toolbar {

  background: white;

  padding: 18px;

  border-radius: 14px;

  margin-bottom: 20px;

  display: flex;

  gap: 12px;

  flex-wrap: wrap;

}


.search-box {

  flex: 1;

  min-width: 250px;

}


.search-box input {

  width: 100%;

  padding: 12px;

  border:
    1px solid
    #d1d5db;

  border-radius: 8px;

  font-size: 14px;

}


.refresh-button {

  border: none;

  background: #222;

  color: white;

  padding:
    11px
    18px;

  border-radius: 8px;

  cursor: pointer;

}


.refresh-button:hover {

  background: #444;

}


/* ============================================================
   TABLE
   ============================================================ */

.table-container {

  background: white;

  border-radius: 14px;

  overflow: auto;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.05);

}


table {

  width: 100%;

  border-collapse: collapse;

  min-width: 800px;

}


thead {

  background: #f8f9fa;

}


th {

  text-align: left;

  padding: 15px;

  font-size: 13px;

  border-bottom:
    1px solid
    #e5e7eb;

  white-space: nowrap;

}


td {

  padding: 14px 15px;

  font-size: 13px;

  border-bottom:
    1px solid
    #f0f0f0;

}


tbody tr:hover {

  background: #fafafa;

}


/* ============================================================
   BADGE
   ============================================================ */

.scan-badge {

  display: inline-block;

  padding:
    5px
    9px;

  border-radius: 20px;

  font-size: 12px;

  font-weight: bold;

}


.scan-success {

  background: #dcfce7;

  color: #166534;

}


.scan-zero {

  background: #f3f4f6;

  color: #555;

}


/* ============================================================
   EMPTY
   ============================================================ */

.empty {

  text-align: center;

  padding: 50px;

  color: #777;

}


/* ============================================================
   LOADING
   ============================================================ */

.loading {

  text-align: center;

  padding: 40px;

  color: #777;

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (
  max-width: 800px
) {

  .header {

    padding:
      15px;

  }


  .main {

    padding:
      15px;

  }


  .stats {

    grid-template-columns:
      1fr;

  }


  .header-right {

    gap: 8px;

  }


  .last-updated {

    display: none;

  }

}

</style>

</head>


<body>


<!-- ==========================================================
     LOGIN PAGE
     ========================================================== -->

<div id="loginPage">


  <div class="login-card">


    <div class="login-logo">

      <h1>
        Savills
      </h1>

      <p>
        Scans Dashboard
      </p>

    </div>


    <div class="form-group">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
      >

    </div>


    <div class="form-group">

      <label>
        Password
      </label>


      <div class="password-wrapper">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
        >


        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword()"
          id="togglePasswordButton"
        >

          Show

        </button>

      </div>

    </div>


    <button
      id="loginButton"
      class="login-button"
      onclick="login()"
    >

      Login

    </button>


    <div
      id="loginStatus"
      class="login-status"
    ></div>


  </div>

</div>


<!-- ==========================================================
     DASHBOARD PAGE
     ========================================================== -->

<div id="dashboardPage">


  <!-- HEADER -->

  <div class="header">


    <div class="header-left">

      <h1>
        Savills Scans Dashboard
      </h1>

      <p>
        QR Check-in Management
      </p>

    </div>


    <div class="header-right">

      <span
        id="lastUpdated"
        class="last-updated"
      >

        Last updated: -

      </span>


      <button
        class="logout-button"
        onclick="logout()"
      >

        Logout

      </button>

    </div>


  </div>


  <!-- MAIN -->

  <div class="main">


    <!-- STATISTICS -->

    <div class="stats">


      <div class="stat-card">

        <div class="stat-title">
          Total Records
        </div>

        <div
          id="totalRecords"
          class="stat-value"
        >

          0

        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          Checked In
        </div>

        <div
          id="checkedIn"
          class="stat-value"
        >

          0

        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          Total Scans
        </div>

        <div
          id="totalScans"
          class="stat-value"
        >

          0

        </div>

      </div>


    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">


      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          placeholder="Search QR ID, name, email, phone..."
          oninput="filterTable()"
        >

      </div>


      <button
        class="refresh-button"
        onclick="loadData()"
      >

        ↻ Refresh

      </button>


    </div>


    <!-- TABLE -->

    <div class="table-container">


      <table>


        <thead>

          <tr id="tableHeader">

          </tr>

        </thead>


        <tbody
          id="tableBody"
        >

          <tr>

            <td
              colspan="10"
              class="loading"
            >

              Loading...

            </td>

          </tr>

        </tbody>


      </table>


    </div>


  </div>

</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyTOQbxRfBmBxPMBDH7VgEGXvNax5ib4ju6h4GjD60WuBxusw1HjitzyVbgjJzqcUl6zQ/exec";


// ============================================================
// GLOBAL VARIABLES
// ============================================================

let sessionToken = null;

let allData = [];

let headers = [];

let refreshTimer = null;


// ============================================================
// PASSWORD VISIBILITY
// ============================================================

function togglePassword() {

  const password =
    document.getElementById(
      "password"
    );

  const button =
    document.getElementById(
      "togglePasswordButton"
    );


  if (
    password.type ===
    "password"
  ) {

    password.type =
      "text";

    button.innerText =
      "Hide";

  }

  else {

    password.type =
      "password";

    button.innerText =
      "Show";

  }

}


// ============================================================
// LOGIN
// ============================================================

function login() {

  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const button =
    document.getElementById(
      "loginButton"
    );


  const status =
    document.getElementById(
      "loginStatus"
    );


  if (
    !username ||
    !password
  ) {

    status.innerText =
      "Please enter username and password.";

    status.className =
      "login-status login-error";

    return;

  }


  button.disabled =
    true;


  status.innerText =
    "Signing in...";

  status.className =
    "login-status";


  const callbackName =
    "loginCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "LOGIN RESPONSE:",
        result
      );


      if (
        result &&
        result.success &&
        result.token
      ) {

        sessionToken =
          result.token;


        sessionStorage.setItem(
          "savills_dashboard_token",
          sessionToken
        );


        document.getElementById(
          "password"
        ).value = "";


        showDashboard();


        loadData();


        startAutoRefresh();

      }

      else {

        status.innerText =
          result &&
          result.message
            ? result.message
            : "Invalid username or password.";

        status.className =
          "login-status login-error";


        button.disabled =
          false;

      }


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(
      username
    ) +
    "&password=" +
    encodeURIComponent(
      password
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      status.innerText =
        "Unable to connect to server.";

      status.className =
        "login-status login-error";


      button.disabled =
        false;


      delete window[
        callbackName
      ];

    };


  document.body.appendChild(
    script
  );

}


// ============================================================
// SHOW DASHBOARD
// ============================================================

function showDashboard() {

  document.getElementById(
    "loginPage"
  ).style.display =
    "none";


  document.getElementById(
    "dashboardPage"
  ).style.display =
    "block";

}


// ============================================================
// SHOW LOGIN
// ============================================================

function showLogin() {

  document.getElementById(
    "loginPage"
  ).style.display =
    "flex";


  document.getElementById(
    "dashboardPage"
  ).style.display =
    "none";

}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

  stopAutoRefresh();


  if (
    sessionToken
  ) {

    const callbackName =
      "logoutCallback_" +
      Date.now();


    window[callbackName] =
      function() {

        delete window[
          callbackName
        ];

      };


    const script =
      document.createElement(
        "script"
      );


    script.src =
      API_URL +
      "?action=logout" +
      "&token=" +
      encodeURIComponent(
        sessionToken
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  }


  sessionToken =
    null;


  sessionStorage.removeItem(
    "savills_dashboard_token"
  );


  allData =
    [];


  showLogin();

}


// ============================================================
// RESTORE SESSION
// ============================================================

function restoreSession() {

  const savedToken =
    sessionStorage.getItem(
      "savills_dashboard_token"
    );


  if (
    !savedToken
  ) {

    showLogin();

    return;

  }


  sessionToken =
    savedToken;


  showDashboard();


  loadData();


  startAutoRefresh();

}


// ============================================================
// LOAD DATA
// ============================================================

function loadData() {

  if (
    !sessionToken
  ) {

    return;

  }


  const callbackName =
    "dataCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "DATA RESPONSE:",
        result
      );


      if (
        result &&
        result.authenticated === false
      ) {

        handleSessionExpired();

        delete window[
          callbackName
        ];

        return;

      }


      if (
        !result ||
        !result.success
      ) {

        console.error(
          "Data loading failed:",
          result
        );

        delete window[
          callbackName
        ];

        return;

      }


      headers =
        result.headers || [];


      allData =
        result.data || [];


      renderTable(
        allData
      );


      updateStatistics(
        allData
      );


      document.getElementById(
        "lastUpdated"
      ).innerText =
        "Last updated: " +
        new Date().toLocaleTimeString();


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=getData" +
    "&token=" +
    encodeURIComponent(
      sessionToken
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      console.error(
        "Unable to load data."
      );


      delete window[
        callbackName
      ];

    };


  document.body.appendChild(
    script
  );

}


// ============================================================
// SESSION EXPIRED
// ============================================================

function handleSessionExpired() {

  stopAutoRefresh();


  sessionToken =
    null;


  sessionStorage.removeItem(
    "savills_dashboard_token"
  );


  showLogin();


  document.getElementById(
    "loginStatus"
  ).innerText =
    "Session expired. Please login again.";

}


// ============================================================
// AUTO REFRESH
// ============================================================

function startAutoRefresh() {

  stopAutoRefresh();


  refreshTimer =
    setInterval(

      function() {

        if (
          sessionToken
        ) {

          loadData();

        }

      },

      5000

    );

}


function stopAutoRefresh() {

  if (
    refreshTimer
  ) {

    clearInterval(
      refreshTimer
    );

    refreshTimer =
      null;

  }

}


// ============================================================
// UPDATE STATISTICS
// ============================================================

function updateStatistics(
  data
) {

  const total =
    data.length;


  let checkedIn =
    0;


  let totalScans =
    0;


  data.forEach(
    function(row) {

      const scanCount =
        Number(
          getScanCount(row)
        ) || 0;


      totalScans +=
        scanCount;


      if (
        scanCount >= 1
      ) {

        checkedIn++;

      }

    }
  );


  document.getElementById(
    "totalRecords"
  ).innerText =
    total;


  document.getElementById(
    "checkedIn"
  ).innerText =
    checkedIn;


  document.getElementById(
    "totalScans"
  ).innerText =
    totalScans;

}


// ============================================================
// FIND SCAN COUNT
// ============================================================

function getScanCount(
  row
) {

  const possibleNames = [

    "Scan Count",

    "scanCount",

    "SCAN COUNT",

    "Count",

    "count"

  ];


  for (
    const name of possibleNames
  ) {

    if (
      Object.prototype.hasOwnProperty.call(
        row,
        name
      )
    ) {

      return row[name];

    }

  }


  return 0;

}


// ============================================================
// RENDER TABLE
// ============================================================

function renderTable(
  data
) {

  const header =
    document.getElementById(
      "tableHeader"
    );


  const body =
    document.getElementById(
      "tableBody"
    );


  header.innerHTML =
    "";


  body.innerHTML =
    "";


  // ==========================================================
  // HEADER
  // ==========================================================

  headers.forEach(
    function(column) {

      const th =
        document.createElement(
          "th"
        );


      th.innerText =
        column;


      header.appendChild(
        th
      );

    }
  );


  // ==========================================================
  // EMPTY
  // ==========================================================

  if (
    data.length === 0
  ) {

    const tr =
      document.createElement(
        "tr"
      );


    const td =
      document.createElement(
        "td"
      );


    td.colSpan =
      Math.max(
        headers.length,
        1
      );


    td.className =
      "empty";


    td.innerText =
      "No data found.";


    tr.appendChild(
      td
    );


    body.appendChild(
      tr
    );


    return;

  }


  // ==========================================================
  // ROWS
  // ==========================================================

  data.forEach(
    function(row) {

      const tr =
        document.createElement(
          "tr"
        );


      headers.forEach(
        function(column) {

          const td =
            document.createElement(
              "td"
            );


          const value =
            row[column] || "";


          // ==================================================
          // SCAN COUNT
          // ==================================================

          if (
            isScanCountColumn(
              column
            )
          ) {

            const count =
              Number(
                value
              ) || 0;


            const badge =
              document.createElement(
                "span"
              );


            badge.className =
              "scan-badge " +
              (
                count >= 1
                  ? "scan-success"
                  : "scan-zero"
              );


            badge.innerText =
              count;


            td.appendChild(
              badge
            );

          }

          else {

            td.innerText =
              value;

          }


          tr.appendChild(
            td
          );

        }
      );


      body.appendChild(
        tr
      );

    }
  );

}


// ============================================================
// CHECK SCAN COUNT COLUMN
// ============================================================

function isScanCountColumn(
  column
) {

  const name =
    String(
      column
    ).toLowerCase();


  return (
    name === "scan count" ||
    name === "scancount" ||
    name === "count"
  );

}


// ============================================================
// SEARCH
// ============================================================

function filterTable() {

  const keyword =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if (
    !keyword
  ) {

    renderTable(
      allData
    );

    return;

  }


  const filtered =
    allData.filter(
      function(row) {

        return headers.some(
          function(column) {

            return String(
              row[column] || ""
            )
              .toLowerCase()
              .includes(
                keyword
              );

          }
        );

      }
    );


  renderTable(
    filtered
  );

}


// ============================================================
// ENTER KEY LOGIN
// ============================================================

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      const loginPage =
        document.getElementById(
          "loginPage"
        );


      if (
        loginPage.style.display !==
        "none"
      ) {

        login();

      }

    }

  }
);


// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    restoreSession();

  }
);

</script>

</body>

</html>
